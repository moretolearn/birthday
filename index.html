<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday!</title>
  
  <!-- External Fonts & Confetti Library -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top left, #2c1a04, #0f0b03, #1f1402);
      --card-bg: rgba(30, 22, 10, 0.45);
      --card-border: rgba(255, 215, 0, 0.35);
      --accent-color: #f39c12;
      --gold-light: #ffeaa7;
      --gold-main: #ffd700;
      --gold-dark: #d4af37;
      --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
      --text-main: #ffffff;
      --text-muted: rgba(255, 235, 175, 0.75);
    }

    /* Theme Overrides */
    body.theme-cyber {
      --bg-gradient: radial-gradient(circle at top left, #032b2b, #020d18, #18022b);
      --card-bg: rgba(255, 255, 255, 0.12);
      --card-border: rgba(255, 255, 255, 0.25);
      --accent-color: #00d2d3;
      --gold-main: #ff9ff3;
      --gold-gradient: linear-gradient(135deg, #00d2d3, #ff9ff3);
      --text-muted: rgba(255, 255, 255, 0.75);
    }

    body.theme-rose {
      --bg-gradient: radial-gradient(circle at top left, #1a103c, #0b0f19, #2b0b23);
      --card-bg: rgba(255, 255, 255, 0.12);
      --card-border: rgba(255, 255, 255, 0.25);
      --accent-color: #ff3366;
      --gold-main: #ff6b81;
      --gold-gradient: linear-gradient(135deg, #ff3366, #ff6b81);
      --text-muted: rgba(255, 255, 255, 0.75);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
      transition: background 0.8s ease;
    }

    /* Floating Animated Canvas Background */
    #particle-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Interactive Overlay Screen */
    .hero-overlay {
      position: fixed;
      inset: 0;
      background: #0f0b03;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      transition: transform 0.8s cubic-bezier(0.85, 0, 0.15, 1), opacity 0.6s ease;
    }

    .hero-overlay.dismissed {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .gift-btn {
      background: var(--gold-gradient);
      color: #000000;
      border: none;
      padding: 20px 48px;
      font-size: 1.25rem;
      font-weight: 800;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(212, 175, 55, 0.4);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      letter-spacing: 0.5px;
    }

    .gift-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 18px 45px rgba(255, 215, 0, 0.6);
    }

    /* Main Modern Glass Card */
    .card-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 560px;
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--card-border);
      border-radius: 36px;
      padding: 44px 32px;
      text-align: center;
      box-shadow: 0 35px 70px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(255, 215, 0, 0.08);
    }

    /* Controls Bar */
    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .theme-selector {
      display: flex;
      gap: 8px;
    }

    .theme-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid white;
      transition: transform 0.2s;
    }

    .theme-dot:hover {
      transform: scale(1.2);
    }

    /* Avatar & Badge */
    .avatar-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--gold-main);
      box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
    }

    /* Typography */
    h1.recipient-name {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      line-height: 1.2;
    }

    p.custom-wish {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 28px;
      font-weight: 300;
    }

    /* Interactive Candle Cake */
    .cake-zone {
      margin: 20px 0 32px;
      cursor: pointer;
      display: inline-block;
    }

    .flame-light {
      animation: pulseFlame 0.6s infinite alternate ease-in-out;
      transform-origin: center;
    }

    @keyframes pulseFlame {
      0% { transform: scale(1) rotate(-3deg); opacity: 0.85; }
      100% { transform: scale(1.25) rotate(3deg); opacity: 1; }
    }

    /* Memory Collage */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 32px;
    }

    .photo-item {
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 1;
      border: 1px solid var(--card-border);
      transition: transform 0.3s ease;
    }

    .photo-item:hover {
      transform: translateY(-4px);
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Action Buttons */
    .cta-button {
      width: 100%;
      background: var(--gold-gradient);
      color: #000000;
      border: none;
      padding: 18px;
      border-radius: 20px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 35px rgba(255, 215, 0, 0.5);
    }

    /* Modal / Secret Note */
    .secret-box {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid var(--gold-dark);
      border-radius: 16px;
      font-size: 0.95rem;
      color: var(--gold-light);
    }

    /* Floating Music Toggle Button */
    .music-toggle-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 100;
      background: rgba(15, 11, 3, 0.85);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--gold-light);
      padding: 12px 20px;
      border-radius: 40px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .music-toggle-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 30px rgba(255, 215, 0, 0.3);
      background: rgba(25, 18, 5, 0.95);
    }

    .music-toggle-btn.playing {
      border-color: var(--gold-main);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
    }
  </style>
</head>
<body>

  <!-- Particle Layer -->
  <canvas id="particle-canvas"></canvas>

  <!-- Opening Envelope Screen -->
  <div class="hero-overlay" id="overlay">
    <h2 style="font-weight: 300; letter-spacing: 3px; margin-bottom: 24px; color: var(--gold-light);">SPECIAL CELEBRATION</h2>
    <button class="gift-btn" onclick="startExperience()">Open Birthday Card 🎁</button>
  </div>

  <!-- Main Card Container -->
  <div class="card-container">
    
    <!-- Top Utilities -->
    <div class="top-controls">
      <span style="font-size: 0.8rem; color: var(--text-muted);">SELECT THEME:</span>
      <div class="theme-selector">
        <div class="theme-dot" style="background: #f39c12;" onclick="setTheme('gold')"></div>
        <div class="theme-dot" style="background: #00d2d3;" onclick="setTheme('cyber')"></div>
        <div class="theme-dot" style="background: #ff3366;" onclick="setTheme('rose')"></div>
      </div>
    </div>

    <!-- Avatar Header -->
    <div class="avatar-wrapper">
      <img id="profileImg" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop" alt="Profile" />
    </div>

    <!-- Personalized Greetings -->
    <h1 class="recipient-name" id="displayTitle">Happy Birthday!</h1>
    <p class="custom-wish" id="displayWish">
      Wishing you a magical day filled with laughter, love, and incredible moments.
    </p>

    <!-- Interactive Cake & Candle -->
    <div class="cake-zone" onclick="blowOutCandle()">
      <svg width="110" height="110" viewBox="0 0 100 100">
        <!-- Base Layer -->
        <rect x="20" y="65" width="60" height="25" rx="5" fill="#d4af37" />
        <rect x="30" y="45" width="40" height="20" rx="3" fill="#ffeaa7" />
        <!-- Candle -->
        <rect x="47" y="28" width="6" height="17" rx="2" fill="#ffd700" />
        <!-- Flame -->
        <path id="candleFlame" class="flame-light" d="M 50 16 Q 44 23 50 28 Q 56 23 50 16 Z" fill="#fffa65" />
      </svg>
      <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: -6px;" id="cakeStatus">Tap to blow out candle 🕯️</p>
    </div>

    <!-- Photo Collage -->
    <div class="photo-grid">
      <div class="photo-item"><img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?w=300&auto=format&fit=crop" alt="Memory 1" /></div>
      <div class="photo-item"><img src="https://images.unsplash.com/photo-1527529482837-4698179dc6ce?w=300&auto=format&fit=crop" alt="Memory 2" /></div>
      <div class="photo-item"><img src="https://images.unsplash.com/photo-1464366400600-7168b8af9bc3?w=300&auto=format&fit=crop" alt="Memory 3" /></div>
    </div>

    <!-- Interactive Reveal Button -->
    <button class="cta-button" onclick="triggerCelebration()">Celebrate Now! 🎊</button>
    
    <div class="secret-box" id="secretNote">
      ✨ <strong>Special Surprise:</strong> Make a wish and check your inbox for your gift card!
    </div>

  </div>

  <!-- Floating Audio Button & Audio Element -->
  <button class="music-toggle-btn" id="musicBtn" onclick="toggleMusic()">
    <span id="musicIcon">🎵</span>
    <span id="musicText">Play Music</span>
  </button>

  <audio id="bgSong" loop preload="auto">
    <source src="song.mp3" type="audio/mpeg" />
  </audio>

  <script>
    // 1. URL Query Parameter Handler (?name=Sarah&wish=Your+Custom+Wish)
    function parseURLParams() {
      const params = new URLSearchParams(window.location.search);
      const name = params.get('name');
      const wish = params.get('wish');

      if (name) {
        document.getElementById('displayTitle').innerText = `Happy Birthday, ${name}!`;
      }
      if (wish) {
        document.getElementById('displayWish').innerText = wish;
      }
    }
    parseURLParams();

    // 2. Audio Control Functions
    function toggleMusic() {
      const song = document.getElementById('bgSong');
      const btn = document.getElementById('musicBtn');
      const icon = document.getElementById('musicIcon');
      const text = document.getElementById('musicText');

      if (song.paused) {
        song.volume = 0.5;
        song.play().then(() => {
          btn.classList.add('playing');
          icon.innerText = '⏸️';
          text.innerText = 'Pause Music';
        }).catch(err => console.log('Audio playback prevented:', err));
      } else {
        song.pause();
        btn.classList.remove('playing');
        icon.innerText = '🎵';
        text.innerText = 'Play Music';
      }
    }

    function fadeOutMusic(duration = 1500) {
      const song = document.getElementById('bgSong');
      const btn = document.getElementById('musicBtn');
      
      if (!song || song.paused) return;

      const startVolume = song.volume;
      const intervalTime = 50;
      const step = startVolume / (duration / intervalTime);

      const fadeInterval = setInterval(() => {
        if (song.volume > step) {
          song.volume -= step;
        } else {
          song.volume = 0;
          song.pause();
          clearInterval(fadeInterval);
          song.volume = startVolume;

          if (btn) {
            btn.classList.remove('playing');
            document.getElementById('musicIcon').innerText = '🎵';
            document.getElementById('musicText').innerText = 'Play Music';
          }
        }
      }, intervalTime);
    }

    // 3. Experience Initializer
    function startExperience() {
      document.getElementById('overlay').classList.add('dismissed');
      
      const song = document.getElementById('bgSong');
      song.volume = 0.5;
      song.play().then(() => {
        const btn = document.getElementById('musicBtn');
        btn.classList.add('playing');
        document.getElementById('musicIcon').innerText = '⏸️';
        document.getElementById('musicText').innerText = 'Pause Music';
      }).catch(err => console.log('Autoplay prevented:', err));

      launchConfetti();
    }

    // 4. Theme Switching
    function setTheme(theme) {
      document.body.className = '';
      if (theme !== 'gold') {
        document.body.classList.add(`theme-${theme}`);
      }
    }

    // 5. Candle Blowing Handler
    function blowOutCandle() {
      const flame = document.getElementById('candleFlame');
      const status = document.getElementById('cakeStatus');
      
      if (flame) flame.style.display = 'none';
      if (status) status.innerText = "✨ Your Wish Is Sent! ✨";

      fadeOutMusic(1500);

      confetti({
        particleCount: 50,
        spread: 60,
        colors: ['#ffd700', '#ffeaa7', '#ffffff', '#d4af37'],
        origin: { y: 0.6 }
      });
    }

    // 6. Celebration Triggers
    function launchConfetti() {
      confetti({
        particleCount: 100,
        spread: 70,
        colors: ['#ffd700', '#ffeaa7', '#ffffff', '#d4af37', '#f39c12'],
        origin: { y: 0.6 }
      });
    }

    function triggerCelebration() {
      launchConfetti();
      document.getElementById('secretNote').style.display = 'block';
    }

    // 7. Ambient Warm Gold Particle Animation
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 50; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2.2 + 0.8,
        dy: -Math.random() * 0.5 - 0.15,
        a: Math.random() * 0.8 + 0.2
      });
    }

    function renderParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.y += p.dy;
        if (p.y < 0) p.y = canvas.height;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 215, 0, ${p.a})`;
        ctx.fill();
      });
      requestAnimationFrame(renderParticles);
    }
    renderParticles();
  </script>
</body>
</html>
